<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <title>メンテナンス中 | SUNABA</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', 'Hiragino Sans', sans-serif; background: #f9fafb; min-height: 100vh; display: flex; flex-direction: column; }
    .header { background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.1); position: sticky; top: 0; z-index: 50; }
    .header-inner { max-width: 80rem; margin: 0 auto; padding: .75rem 1rem; display: flex; align-items: center; }
    .header-logo { height: 2rem; }
    main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 4rem 1rem; }
    .card { background: #fff; border-radius: 1rem; box-shadow: 0 4px 24px rgba(0,0,0,.08); padding: 2.5rem; max-width: 28rem; width: 100%; text-align: center; }
    .icon-wrap { display: flex; justify-content: center; margin-bottom: 1.5rem; }
    .icon-bg { background: #eff6ff; border-radius: 9999px; padding: 1rem; }
    .icon { width: 3rem; height: 3rem; color: #2563eb; }
    h1 { font-size: 1.5rem; font-weight: 700; color: #111827; margin-bottom: .75rem; }
    .desc { color: #6b7280; line-height: 1.75; margin-bottom: 1.5rem; }
    .hours-box { background: #eff6ff; border: 1px solid #bfdbfe; border-radius: .5rem; padding: 1rem 1.5rem; display: inline-block; }
    .hours-label { font-size: .75rem; color: #3b82f6; font-weight: 600; margin-bottom: .25rem; }
    .hours-value { color: #1d4ed8; font-weight: 700; font-size: 1.125rem; }
    .note { font-size: .875rem; color: #9ca3af; margin-top: 1.5rem; }
    footer { background: #1f2937; color: #9ca3af; text-align: center; padding: 1.5rem; font-size: .875rem; }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <header class="header">
    <div class="header-inner">
      <img src="header_logo.png" alt="SUNABA" class="header-logo">
    </div>
  </header>

  <main>
    <div class="card">

      <div class="icon-wrap">
        <div class="icon-bg">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="icon">
            <path stroke-linecap="round" stroke-linejoin="round" d="M11.42 15.17 17.25 21A2.652 2.652 0 0 0 21 17.25l-5.877-5.877M11.42 15.17l2.496-3.03c.317-.384.74-.626 1.208-.766M11.42 15.17l-4.655 5.653a2.548 2.548 0 1 1-3.586-3.586l6.837-5.63m5.108-.233c.55-.164 1.163-.188 1.743-.14a4.5 4.5 0 0 0 4.486-6.336l-3.276 3.277a3.004 3.004 0 0 1-2.25-2.25l3.276-3.276a4.5 4.5 0 0 0-6.336 4.486c.049.58.025 1.193-.14 1.743"/>
          </svg>
        </div>
      </div>

      <h1>ただいまメンテナンス中です</h1>
      <p class="desc">
        ご不便をおかけして申し訳ございません。<br>
        現在、システムメンテナンスを実施しております。
      </p>

      <div class="hours-box">
        <p class="hours-label">営業時間</p>
        <p class="hours-value">9:00 〜 19:00</p>
      </div>

      <p class="note">営業時間内に再度アクセスをお願いいたします。</p>
    </div>
  </main>

  <footer>
      © 2025 SUNABA. All rights reserved.
  </footer>

</body>
</html>
