<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <title>メンテナンス中 | SUNABA</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Segoe UI', 'Hiragino Sans', sans-serif; background: #f9fafb; }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <header class="bg-white shadow-sm sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center">
      <img src="header_logo.png" alt="SUNABA" class="h-8">
    </div>
  </header>

  <main class="flex-1 flex items-center justify-center px-4 py-16">
    <div class="bg-white rounded-2xl shadow-lg p-10 max-w-md w-full text-center">

      <div class="flex justify-center mb-6">
        <div class="bg-blue-50 rounded-full p-4">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-12 h-12 text-blue-600">
            <path stroke-linecap="round" stroke-linejoin="round" d="M11.42 15.17 17.25 21A2.652 2.652 0 0 0 21 17.25l-5.877-5.877M11.42 15.17l2.496-3.03c.317-.384.74-.626 1.208-.766M11.42 15.17l-4.655 5.653a2.548 2.548 0 1 1-3.586-3.586l6.837-5.63m5.108-.233c.55-.164 1.163-.188 1.743-.14a4.5 4.5 0 0 0 4.486-6.336l-3.276 3.277a3.004 3.004 0 0 1-2.25-2.25l3.276-3.276a4.5 4.5 0 0 0-6.336 4.486c.049.58.025 1.193-.14 1.743"/>
          </svg>
        </div>
      </div>

      <h1 class="text-2xl font-bold text-gray-900 mb-3">ただいまメンテナンス中です</h1>
      <p class="text-gray-500 leading-relaxed mb-6">
        ご不便をおかけして申し訳ございません。<br>
        現在、システムメンテナンスを実施しております。
      </p>

      <div class="bg-blue-50 border border-blue-200 rounded-lg px-6 py-4 inline-block">
        <p class="text-xs text-blue-500 font-medium mb-1">営業時間</p>
        <p class="text-blue-700 font-bold text-lg">9:00 〜 19:00</p>
      </div>

      <p class="text-sm text-gray-400 mt-6">営業時間内に再度アクセスをお願いいたします。</p>
    </div>
  </main>

  <footer class="bg-gray-800 text-gray-400 text-center py-6 text-sm">
    © 2025 SUNABA. All rights reserved.
  </footer>

</body>
</html>
